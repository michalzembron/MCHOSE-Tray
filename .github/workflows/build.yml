name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create a release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build MCHOSE.sln -c Release

      - name: Publish (small, needs .NET 10 Desktop Runtime)
        run: >
          dotnet publish MCHOSE.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none -o out/fd

      - name: Publish (standalone, no runtime needed)
        run: >
          dotnet publish MCHOSE.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out/sc

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/fd/MchoseTray.exe dist/MchoseTray.exe
          Copy-Item out/sc/MchoseTray.exe dist/MchoseTray-standalone.exe
          Get-FileHash dist/*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MchoseTray
          path: dist/

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/MchoseTray.exe dist/MchoseTray-standalone.exe dist/SHA256SUMS.txt
          --title "MCHOSE Tray ${{ github.ref_name }}" --generate-notes
